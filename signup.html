<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="carpoollogo/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="carpoollogo/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="carpoollogo/favicon-16x16.png">
<link rel="manifest" href="carpoollogo/site.webmanifest">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B3411TW2DP"></script>
  <meta charset="UTF-8">
  <title>Sign Up - RideTracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Sign Up</h2>
    <form id="signupForm">
      <input type="text" id="firstName" placeholder="First Name" required>
      <input type="text" id="lastName" placeholder="Last Name" required>
      <input type="email" id="signupEmail" placeholder="Email" required>
      <input type="password" id="signupPassword" placeholder="Password" required>
      <button type="submit" class="btn">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="app.js"></script>
</body>
</html>
