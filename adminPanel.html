
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="carpoollogo/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="carpoollogo/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="carpoollogo/favicon-16x16.png">
<link rel="manifest" href="carpoollogo/site.webmanifest">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B3411TW2DP"></script>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <script>
    const user = localStorage.getItem("firstName");
    if (!user) {
      window.location.href = "login.html";
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <div class="nav-left">
      <a href="index.html">Home</a>
      <a href="addRide.html">Add Ride</a>
      <a href="summary.html">Weekly Summary</a>
      <a href="profileSummary.html">Profile Summary</a>
      <div id="adminNavLink" style="display: none;">
        <a href="rideManager.html">Ride Manager</a>
        <a href="adminPanel.html">Admin Panel</a>
      </div>
    </div>
    <div class="nav-right">
      <span id="welcomeMsg" style="margin-right: 20px;"></span>
      <div class="profile-icon" onclick="toggleProfileMenu()">
        <span id="profileInitials"></span>
        <div id="profileMenu" class="dropdown-content">
          <a href="#" onclick="logout()">Logout</a>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <h2>Admin Panel</h2>
    <p>This area is accessible only to administrators.</p>

    <div id="adminContent" style="margin-top: 20px;">
      <h3>User Accounts</h3>
      <ul id="userList" style="list-style: none; padding-left: 0;"></ul>

      <h3>Activity Logs (Coming Soon)</h3>
      <p>Track who submitted which rides and when.</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="app.js"></script>
  <script>
    function toggleProfileMenu() {
      const menu = document.getElementById("profileMenu");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }

    window.onload = function () {
      const initials = localStorage.getItem("userInitials");
      const firstName = localStorage.getItem("firstName");
      const isAdmin = localStorage.getItem("isAdmin");

      if (initials) document.getElementById("profileInitials").innerText = initials;
      if (firstName) document.getElementById("welcomeMsg").innerText = "Welcome, " + firstName;

      if (isAdmin !== "true") {
        alert("Access denied. Admins only.");
        window.location.href = "index.html";
      }

      if (isAdmin === "true") {
        document.getElementById("adminNavLink").style.display = "block";

        // Fetch and render user list
        const userList = document.getElementById("userList");
        firebase.database().ref("users").once("value").then(snapshot => {
          snapshot.forEach(child => {
            const data = child.val();
            const userId = child.key;
            const li = document.createElement("li");
            li.innerHTML = `
              ${data.firstName || 'Unknown'} (${data.email || 'No Email'})
              <button onclick="deleteUser('${userId}')">Delete</button>
            `;
            userList.appendChild(li);
          });
        });
      }
    };
  </script>
</body>
</html>
